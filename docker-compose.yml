services:
  sentinel:
    build: .
    container_name: sentinel-siem
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - sentinel-data:/app/backend/data
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY:?Set INGEST_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinel-data:
    driver: local
