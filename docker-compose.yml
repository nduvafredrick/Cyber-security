services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-siem
    restart: unless-stopped
    init: true
    ports:
      - "3001:3001"
    volumes:
      - sentinel-data:/app/backend/data
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/backend/data
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY:?Set INGEST_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  sentinel-data:
    driver: local
