services:
  - type: web
    name: sentinel-siem
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
      - key: METRICS_API_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSP_UPGRADE_INSECURE_REQUESTS
        value: "true"
      - key: HSTS
        value: "true"
      - key: LOG_RETENTION_DAYS
        value: "90"
      - key: INGEST_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: BULK_INGEST_RATE_LIMIT_PER_MINUTE
        value: "60"
