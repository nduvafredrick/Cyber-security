name: Sentinel CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Dependency security audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Build Docker image
        run: docker build --pull -t sentinel-siem:ci .
      - name: Docker image smoke test
        run: |
          ADMIN_HASH=$(node -e "console.log(require('./backend/node_modules/bcryptjs').hashSync('ci-password',4))")
          docker run -d --name sentinel-ci             -e NODE_ENV=production             -e JWT_SECRET=ci-jwt-secret-012345678901234567890123456789             -e INGEST_API_KEY=ci-ingest-key-0123456789             -e ADMIN_PASSWORD_HASH="$ADMIN_HASH"             -p 3001:3001 sentinel-siem:ci
          for i in {1..20}; do curl -fsS http://127.0.0.1:3001/ready && exit 0; sleep 2; done
          docker logs sentinel-ci
          exit 1
      - name: Browser UI tests
        run: |
          ADMIN_HASH=$(node -e "console.log(require('./backend/node_modules/bcryptjs').hashSync('ci-password',4))")
          docker rm -f sentinel-browser || true
          docker run -d --name sentinel-browser             -e NODE_ENV=production             -e JWT_SECRET=ci-jwt-secret-012345678901234567890123456789             -e INGEST_API_KEY=ci-ingest-key-0123456789             -e ADMIN_PASSWORD_HASH="$ADMIN_HASH"             -p 3002:3001 sentinel-siem:ci
          for i in {1..20}; do curl -fsS http://127.0.0.1:3002/ready && break; sleep 2; done
          cd frontend
          npx --yes playwright@1.55.0 install --with-deps chromium
          cat > /tmp/sentinel-playwright.config.js <<'EOF'
          module.exports={testDir:process.cwd()+'/test',timeout:30000,use:{browserName:'chromium',baseURL:'http://127.0.0.1:3002',headless:true}}
          EOF
          npx --yes @playwright/test@1.55.0 test --config=/tmp/sentinel-playwright.config.js
      - name: Stop smoke test container
        if: always()
        run: docker rm -f sentinel-ci || true
      - name: Stop browser test container
        if: always()
        run: docker rm -f sentinel-browser || true
