name: Sentinel CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Dependency security audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Build Docker image
        run: docker build --pull -t sentinel-siem:ci .
      - name: Docker image smoke test
        run: |
          ADMIN_HASH=$(node -e "console.log(require('./backend/node_modules/bcryptjs').hashSync('ci-password',4))")
          docker run -d --name sentinel-ci             -e NODE_ENV=production             -e JWT_SECRET=ci-jwt-secret-012345678901234567890123456789             -e INGEST_API_KEY=ci-ingest-key-0123456789             -e ADMIN_PASSWORD_HASH="$ADMIN_HASH"             -p 3001:3001 sentinel-siem:ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/ready; then exit 0; fi
            sleep 2
          done
          docker logs sentinel-ci
          exit 1
      - name: Browser UI tests
        run: |
          ADMIN_HASH=$(node -e "console.log(require('./backend/node_modules/bcryptjs').hashSync('ci-password',4))")
          docker rm -f sentinel-browser || true
          docker run -d --name sentinel-browser             -e NODE_ENV=production             -e JWT_SECRET=ci-jwt-secret-012345678901234567890123456789             -e INGEST_API_KEY=ci-ingest-key-0123456789             -e ADMIN_PASSWORD_HASH="$ADMIN_HASH"             -e SESSION_COOKIE_SECURE=false             -e CSP_UPGRADE_INSECURE_REQUESTS=false             -p 3002:3001 sentinel-siem:ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3002/ready; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3002/ >/tmp/sentinel-index.html
          grep -q 'Sentinel — Security Operations' /tmp/sentinel-index.html
          grep -oE '(src|href)="[^"]+"' /tmp/sentinel-index.html | cut -d'"' -f2 | while read -r asset; do
            case "$asset" in
              /assets/*)
                if ! curl -fsS -o /dev/null -w "ASSET $asset -> %{http_code} %{content_type}\n" "http://127.0.0.1:3002$asset"; then
                  echo "FAILED ASSET: $asset"
                  docker logs sentinel-browser
                  exit 1
                fi
                ;;
            esac
          done
          curl -fsSI http://127.0.0.1:3002/ | tee /tmp/sentinel-headers.txt
          cd frontend
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node --test test/ui.test.js
      - name: Stop smoke test container
        if: always()
        run: docker rm -f sentinel-ci || true
      - name: Stop browser test container
        if: always()
        run: docker rm -f sentinel-browser || true
