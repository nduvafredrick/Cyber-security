name: Sync npm lockfiles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-lockfiles]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize npm lockfiles"
          git push
